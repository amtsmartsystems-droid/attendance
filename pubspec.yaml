name: amt_nfc_attendance
description: نظام AMT لتسجيل حضور وانصراف الموظفين عبر تقنية NFC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # حزمة إدارة NFC المحدثة لحل مشاكل التوافقية مع AGP 9.x
  nfc_manager: ^4.2.1

  # حزمة HTTP - لإرسال طلبات POST إلى السيرفر
  http: ^1.2.1

  # حزمة Supabase - للتواصل مع قاعدة البيانات والـ Edge Functions
  supabase_flutter: ^2.8.4

  # حزمة الأيقونات المادية الموسعة
  cupertino_icons: ^1.0.6

  # حزمة لإدارة حالة التطبيق بشكل بسيط
  provider: ^6.1.2

  # حزمة للـ Animations المتقدمة
  flutter_animate: ^4.5.0

  # حزمة للتخزين الآمن المشفر (Android Keystore / iOS Keychain)
  # تحل ثغرة "سرقة معرف الموظف" - لا يمكن قراءتها حتى مع Root
  flutter_secure_storage: ^9.2.4

  # حزمة لحفظ البيانات محلياً (معرف الموظف)
  shared_preferences: ^2.3.3

  # حزمة للتحقق من الاتصال بالإنترنت
  connectivity_plus: ^6.1.5

  # حزمة للتحقق البيومتري (بصمة + وجه)
  local_auth: ^2.3.0

  # حزمة لقراءة معلومات الشبكة (BSSID للراوتر)
  network_info_plus: ^6.0.1

  # حزمة للتشفير (HMAC-SHA256 + AES)
  crypto: ^3.0.6

  # حزمة لتنسيق التواريخ والأوقات
  intl: ^0.19.0
  mobile_scanner: ^7.3.0
  sqflite: ^2.4.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # الصور والأيقونات المستخدمة
  assets:
    - assets/images/
    - assets/icons/
